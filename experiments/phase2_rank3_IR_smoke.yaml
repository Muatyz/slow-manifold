name: phase2_rank3_IR_smoke
seed: 20260914
identity:
  label_fields:
    rank: model.rank
    lr: train.optimizer.learning_rate

components:
  task: ../configs/task/interval_reproduction.yaml
  model: ../configs/model/rank2_ctrnn.yaml
  train: ../configs/train/rank2_baseline.yaml
  analysis: ../configs/analysis/training_dynamics.yaml
  visualization: ../configs/visualization/training_dynamics.yaml
  reporting: ../configs/reporting/reproduction_startup.yaml

overrides:
  model:
    state_size: 12
    rank: 3
    tau: 10.0
    dt: 1.0
  train:
    device: cpu
    epochs: 1
    batch_size: 4
    validation_batch_size: 8
    log_every: 1
    checkpoint:
      every: 1
    loss:
      phase_weights:
        - {phase: pre_go, lambda: 1.0}
        - {phase: reproduction_wait, lambda: 1.0}
        - {phase: response, lambda: 1.0}
  analysis:
    representative_selection:
      mode: manual
      manual_epochs: [0, 1]
    evaluation_trials:
      - {interval: 30.0, delay: 55.0, s1_onset: 50.0}
      - {interval: 50.0, delay: 55.0, s1_onset: 50.0}
      - {interval: 75.0, delay: 55.0, s1_onset: 50.0}
      - {interval: 99.0, delay: 55.0, s1_onset: 50.0}
    trajectory_count: 8
    neighborhood_sampling:
      anchor_count: 8
      samples_per_anchor: 2
      max_plot_points: 24
    trajectory_slow_point_search:
      seed_count: 12
      max_iterations: 8
      optimization_batch_size: 6
  visualization:
    training_curves_figure_size: [6.0, 4.0]
    outputs_panel_width: 3.0
    outputs_panel_height: 2.0
    latent_dynamics_3d_figure_size: [15.0, 5.0]
    snapshot_dpi: 200
    movie_dpi: 100
    max_3d_trajectories: 8
