name: phase1_rank2_npr # 该 config 用来测试 1e-3 学习率是否会出现 point of no return
seed: 20260903
identity:
  label_fields:
    lr: train.optimizer.learning_rate

components:
  task: ../configs/task/interval_categorization.yaml
  model: ../configs/model/rank2_ctrnn.yaml
  train: ../configs/train/rank2_baseline.yaml
  analysis: ../configs/analysis/training_dynamics.yaml
  visualization: ../configs/visualization/training_dynamics.yaml
  reporting: ../configs/reporting/training_startup.yaml

overrides:
  train:
    optimizer:
      learning_rate: 1e-3
    epochs: 40000
    batch_size: 64
