name: phase5_taskB_rank_cohort
seed: 20260903
identity:
  label_fields:
    rank: model.rank
    lr: train.optimizer.learning_rate

components:
  task: ../configs/task/interval_reproduction.yaml
  model: ../configs/model/rank2_ctrnn.yaml
  train: ../configs/train/rank2_baseline.yaml
  analysis: ../configs/analysis/training_dynamics.yaml
  visualization: ../configs/visualization/training_dynamics.yaml
  reporting: ../configs/reporting/reproduction_startup.yaml

overrides:
  model:
    rank: 5
    tau: 10.0
    dt: 1.0
  train:
    epochs: 400000
    optimizer:
      learning_rate: 1.0e-4
    loss:
      phase_weights:
        - {phase: pre_go, lambda: 1.0}
        - {phase: reproduction_wait, lambda: 1.0}
        - {phase: response, lambda: 1.0}
    # Task B trajectories are long; 1000-update spacing bounds the final
    # trajectory-neighborhood diagnostic while preserving metrics every update.
    checkpoint:
      every: 1000
  analysis:
    evaluation_trials:
      - {interval: 30.0, delay: 55.0, s1_onset: 50.0}
      - {interval: 50.0, delay: 55.0, s1_onset: 50.0}
      - {interval: 75.0, delay: 55.0, s1_onset: 50.0}
      - {interval: 99.0, delay: 55.0, s1_onset: 50.0}
