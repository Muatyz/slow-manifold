[project]
name = "slow"
version = "0.1.0"
description = "Reproducible experiments for timing dynamics in recurrent neural networks"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "imageio-ffmpeg>=0.6",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pyyaml>=6.0",
    "torch>=2.14",
]

[project.scripts]
slow = "slow_manifold.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slow_manifold"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
